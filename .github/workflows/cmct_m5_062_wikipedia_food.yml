name: CMCT M5 062 Wikipedia food image resolver
on:
  push:
    paths:
      - 'scripts/resolve_m5_062_wikipedia_food.py'
      - '.github/workflows/cmct_m5_062_wikipedia_food.yml'
  workflow_dispatch:
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/resolve_m5_062_wikipedia_food.py | tee resolve.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-062-wikipedia-food
          path: |
            evidence/m5_t1_062_wikipedia_food_image/
            resolve.log
          if-no-files-found: error
          retention-days: 30
