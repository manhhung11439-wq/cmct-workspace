name: CMCT M5 048 Gardenia figure
on:
  push:
    paths:
      - 'scripts/acquire_m5_048_gardenia.py'
      - '.github/workflows/cmct_m5_048_gardenia.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: set -o pipefail; python scripts/acquire_m5_048_gardenia.py | tee m5_048_gardenia.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-048-gardenia
          path: |
            evidence/m5_t1_048_gardenia/
            m5_048_gardenia.log
          if-no-files-found: error
          retention-days: 30
