name: CMCT M5 Commons material sweep 20
on:
  push:
    paths:
      - 'scripts/commons_m5_material_sweep20.py'
      - '.github/workflows/cmct_m5_material_sweep20.yml'
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: set -o pipefail; python scripts/commons_m5_material_sweep20.py | tee sweep.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-commons-material-sweep20
          path: |
            evidence/m5_t1_commons_sweep20/
            sweep.log
          if-no-files-found: error
          retention-days: 30
