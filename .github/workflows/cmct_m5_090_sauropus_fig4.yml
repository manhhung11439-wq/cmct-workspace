name: CMCT M5 090 Sauropus harvested leaves Fig4
on:
  push:
    paths:
      - 'scripts/acquire_m5_090_sauropus_fig4.py'
      - '.github/workflows/cmct_m5_090_sauropus_fig4.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_090_sauropus_fig4.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-090-sauropus-fig4
          path: |
            evidence/m5_t1_090_sauropus_fig4/
            acquire.log
          if-no-files-found: error
          retention-days: 30
