name: CMCT M5 PD pharmacognosy scout 12 15 18
on:
  push:
    paths:
      - 'scripts/scout_m5_pd_pharmacognosy_12_15_18.py'
      - '.github/workflows/cmct_m5_pd_pharmacognosy_12_15_18.yml'
  workflow_dispatch:
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pymupdf pillow
      - run: set -o pipefail; python scripts/scout_m5_pd_pharmacognosy_12_15_18.py | tee scout_m5_pd_12_15_18.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-pd-pharmacognosy-12-15-18
          path: |
            evidence/m5_t1_pd_pharmacognosy_12_15_18/
            scout_m5_pd_12_15_18.log
          if-no-files-found: error
          retention-days: 30
