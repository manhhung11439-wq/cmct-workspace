name: CMCT M5 091 Lotus hi-res probe
on:
  push:
    paths:
      - 'scripts/probe_m5_091_lotus_hires.py'
      - '.github/workflows/cmct_m5_091_lotus_hires.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: python scripts/probe_m5_091_lotus_hires.py | tee probe_m5_091_lotus_hires.log
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-091-lotus-hires
          path: |
            evidence/m5_t1_091_lotus_hires/
            probe_m5_091_lotus_hires.log
          if-no-files-found: error
          retention-days: 30
