name: CMCT M5 082 Houttuynia bundle
on:
  push:
    paths:
      - 'scripts/acquire_m5_082_houttuynia_bundle.py'
      - '.github/workflows/cmct_m5_082_houttuynia_bundle.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_082_houttuynia_bundle.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-082-houttuynia-bundle
          path: |
            evidence/m5_t1_082_houttuynia_bundle/
            acquire.log
          if-no-files-found: error
          retention-days: 30
