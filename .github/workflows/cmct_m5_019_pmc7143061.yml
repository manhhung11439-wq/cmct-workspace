name: CMCT M5 019 PMC7143061 scout
on:
  push:
    paths:
      - 'scripts/scout_m5_019_pmc7143061.py'
      - '.github/workflows/cmct_m5_019_pmc7143061.yml'
  workflow_dispatch:
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/scout_m5_019_pmc7143061.py | tee scout_m5_019_pmc7143061.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-019-pmc7143061
          path: |
            evidence/m5_t1_019_pmc7143061/
            scout_m5_019_pmc7143061.log
          if-no-files-found: error
          retention-days: 30
