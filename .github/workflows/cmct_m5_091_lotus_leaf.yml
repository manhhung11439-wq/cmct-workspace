name: CMCT M5 091 Lotus leaf processed figure
on:
  push:
    paths:
      - 'scripts/acquire_m5_091_lotus_leaf.py'
      - '.github/workflows/cmct_m5_091_lotus_leaf.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_091_lotus_leaf.py | tee acquire_m5_091_lotus_leaf.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-091-lotus-leaf
          path: |
            evidence/m5_t1_091_lotus_leaf/
            acquire_m5_091_lotus_leaf.log
          if-no-files-found: error
          retention-days: 30
