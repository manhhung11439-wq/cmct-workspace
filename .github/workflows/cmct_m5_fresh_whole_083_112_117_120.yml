name: CMCT M5 fresh whole screen 083 112 117 120
on:
  push:
    paths:
      - 'scripts/scout_m5_fresh_whole_083_112_117_120.py'
      - '.github/workflows/cmct_m5_fresh_whole_083_112_117_120.yml'
  workflow_dispatch:
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/scout_m5_fresh_whole_083_112_117_120.py | tee scout.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-fresh-whole-083-112-117-120
          path: |
            evidence/m5_fresh_whole_083_112_117_120/
            scout.log
          if-no-files-found: error
          retention-days: 30
