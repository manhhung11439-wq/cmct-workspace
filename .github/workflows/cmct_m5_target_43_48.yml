name: CMCT M5 target 43-48 crude drug search
on:
  push:
    paths:
      - 'scripts/search_commons_m5_target_43_48.py'
      - '.github/workflows/cmct_m5_target_43_48.yml'
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/search_commons_m5_target_43_48.py | tee search_target_43_48.log
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-target-43-48
          path: |
            evidence/m5_t1_target_43_48/
            search_target_43_48.log
          if-no-files-found: error
          retention-days: 30
