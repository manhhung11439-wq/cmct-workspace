name: CMCT M5 045 Phellodendron figure
on:
  push:
    paths:
      - 'scripts/acquire_m5_045_phellodendron.py'
      - '.github/workflows/cmct_m5_045_phellodendron.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_045_phellodendron.py | tee acquire_m5_045_phellodendron.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-045-phellodendron
          path: |
            evidence/m5_t1_045_phellodendron/
            acquire_m5_045_phellodendron.log
          if-no-files-found: error
          retention-days: 30
