name: CMCT Hanabishi crude-drug inventory
on:
  push:
    paths:
      - 'scripts/inventory_hanabishi_crude_drugs.py'
      - '.github/workflows/cmct_hanabishi_inventory.yml'
  workflow_dispatch:
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/inventory_hanabishi_crude_drugs.py | tee hanabishi_inventory.log
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-hanabishi-crude-drugs
          path: |
            evidence/hanabishi_crude_drugs/
            hanabishi_inventory.log
          if-no-files-found: error
          retention-days: 30
