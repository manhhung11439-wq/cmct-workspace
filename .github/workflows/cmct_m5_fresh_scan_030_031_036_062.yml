name: CMCT M5 fresh scan 030 031 036 062
on:
  push:
    paths:
      - 'scripts/acquire_m5_fresh_scan_030_031_036_062.py'
      - '.github/workflows/cmct_m5_fresh_scan_030_031_036_062.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_fresh_scan_030_031_036_062.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-fresh-scan-030-031-036-062
          path: |
            evidence/m5_t1_fresh_scan_030_031_036_062/
            acquire.log
          if-no-files-found: error
          retention-days: 30
