name: CMCT M5 045 PCC PDF hi-res
on:
  push:
    paths:
      - 'scripts/acquire_m5_045_pcc_pdf_hires.py'
      - '.github/workflows/cmct_m5_045_pcc_pdf_hires.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pymupdf pillow
      - run: set -o pipefail; python scripts/acquire_m5_045_pcc_pdf_hires.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-045-pcc-pdf-hires
          path: |
            evidence/m5_t1_045_pcc_pdf_hires/
            acquire.log
          if-no-files-found: error
          retention-days: 30
