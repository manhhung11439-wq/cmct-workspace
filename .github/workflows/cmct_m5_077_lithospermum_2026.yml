name: CMCT M5 077 Lithospermum 2026 dried root
on:
  push:
    paths:
      - 'scripts/acquire_m5_077_lithospermum_2026.py'
      - '.github/workflows/cmct_m5_077_lithospermum_2026.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_077_lithospermum_2026.py | tee acquire_m5_077_lithospermum_2026.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-077-lithospermum-2026
          path: |
            evidence/m5_t1_077_lithospermum_2026/
            acquire_m5_077_lithospermum_2026.log
          if-no-files-found: error
          retention-days: 30
