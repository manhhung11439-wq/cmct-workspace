name: CMCT M5 039 iNat exact detached screen
on:
  push:
    paths:
      - 'scripts/screen_m5_039_inat.py'
      - '.github/workflows/cmct_m5_039_inat.yml'
  workflow_dispatch:
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/screen_m5_039_inat.py | tee screen.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-039-inat-exact
          path: |
            evidence/m5_t1_039_inat_exact/
            screen.log
          if-no-files-found: error
          retention-days: 30
