name: CMCT M5 whole-plant fresh screen 083 108 112 117 120
on:
  push:
    paths:
      - 'scripts/screen_m5_wholeplant_083_108_112_117_120.py'
      - '.github/workflows/cmct_m5_wholeplant_083_108_112_117_120.yml'
  workflow_dispatch:
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/screen_m5_wholeplant_083_108_112_117_120.py | tee screen.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-wholeplant-screen-083-108-112-117-120
          path: |
            evidence/m5_fresh_wholeplant_screen_083_108_112_117_120/
            screen.log
          if-no-files-found: error
          retention-days: 30
