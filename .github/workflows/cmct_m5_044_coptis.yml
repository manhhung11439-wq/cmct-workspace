name: CMCT M5 044 Coptis figure
on:
  push:
    paths:
      - 'scripts/acquire_m5_044_coptis.py'
      - '.github/workflows/cmct_m5_044_coptis.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: set -o pipefail; python scripts/acquire_m5_044_coptis.py | tee m5_044_coptis.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-044-coptis
          path: |
            evidence/m5_t1_044_coptis/
            m5_044_coptis.log
          if-no-files-found: error
          retention-days: 30
