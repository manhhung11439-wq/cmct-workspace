name: CMCT M5 037 Gymnema dried powder
on:
  push:
    paths:
      - 'scripts/acquire_m5_037_gymnema_powder.py'
      - '.github/workflows/cmct_m5_037_gymnema_powder.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4 pillow
      - run: set -o pipefail; python scripts/acquire_m5_037_gymnema_powder.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-037-gymnema-powder
          path: |
            evidence/m5_t1_037_gymnema_powder/
            acquire.log
          if-no-files-found: error
          retention-days: 30
