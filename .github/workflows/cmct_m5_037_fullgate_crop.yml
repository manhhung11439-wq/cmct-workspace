name: CMCT M5 037 FULLGATE crop
on:
  push:
    paths:
      - 'scripts/fullgate_m5_037_crop.py'
      - '.github/workflows/cmct_m5_037_fullgate_crop.yml'
  workflow_dispatch:
jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pymupdf pillow
      - run: set -o pipefail; python scripts/fullgate_m5_037_crop.py | tee crop.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-037-fullgate-crop
          path: |
            evidence/m5_t1_037_fullgate_crop/
            crop.log
          if-no-files-found: error
          retention-days: 30
