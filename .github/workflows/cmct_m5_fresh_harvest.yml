name: CMCT M5 fresh harvested material search
on:
  push:
    paths:
      - 'scripts/search_commons_m5_fresh_harvest.py'
      - '.github/workflows/cmct_m5_fresh_harvest.yml'
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/search_commons_m5_fresh_harvest.py | tee search_fresh_harvest.log
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-fresh-harvest
          path: |
            evidence/m5_t1_fresh_harvest_commons/
            search_fresh_harvest.log
          if-no-files-found: error
          retention-days: 30
