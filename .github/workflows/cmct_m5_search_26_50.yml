name: CMCT M5 Commons processed search 26-50
on:
  push:
    paths:
      - 'scripts/search_commons_m5_26_50.py'
      - '.github/workflows/cmct_m5_search_26_50.yml'
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/search_commons_m5_26_50.py | tee search_26_50.log
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-commons-26-50
          path: |
            evidence/m5_t1_26_50_commons/
            search_26_50.log
          if-no-files-found: error
          retention-days: 30
