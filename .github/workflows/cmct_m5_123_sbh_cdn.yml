name: CMCT M5 123 SBH original CDN
on:
  push:
    paths:
      - 'scripts/probe_m5_123_sbh_cdn.py'
      - '.github/workflows/cmct_m5_123_sbh_cdn.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/probe_m5_123_sbh_cdn.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-123-sbh-cdn
          path: |
            evidence/m5_t1_123_sbh_cdn/
            acquire.log
          if-no-files-found: error
          retention-days: 30
