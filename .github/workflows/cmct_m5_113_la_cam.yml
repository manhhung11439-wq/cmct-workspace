name: CMCT M5 113 La Cam
on:
  push:
    paths:
      - 'scripts/acquire_m5_113_la_cam.py'
      - '.github/workflows/cmct_m5_113_la_cam.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_113_la_cam.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-113-la-cam
          path: |
            evidence/m5_t1_113_la_cam/
            acquire.log
          if-no-files-found: error
          retention-days: 30
