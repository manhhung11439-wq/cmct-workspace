name: CMCT M5 031 Vitex harvested leafy branch
on:
  push:
    paths:
      - 'scripts/acquire_m5_031_vitex.py'
      - '.github/workflows/cmct_m5_031_vitex.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_031_vitex.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-031-vitex
          path: |
            evidence/m5_t1_031_vitex_negundo/
            acquire.log
          if-no-files-found: error
          retention-days: 30
