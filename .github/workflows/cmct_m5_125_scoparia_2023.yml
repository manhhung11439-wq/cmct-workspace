name: CMCT M5 125 Scoparia pharmacognosy
on:
  push:
    paths:
      - 'scripts/acquire_m5_125_scoparia_2023.py'
      - '.github/workflows/cmct_m5_125_scoparia_2023.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4 pymupdf
      - run: set -o pipefail; python scripts/acquire_m5_125_scoparia_2023.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-125-scoparia-2023
          path: |
            evidence/m5_t1_125_scoparia_2023/
            acquire.log
          if-no-files-found: error
          retention-days: 30
