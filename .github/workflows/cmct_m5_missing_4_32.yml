name: CMCT M5 missing 4-32 medicinal material search
on:
  push:
    paths:
      - 'scripts/search_commons_m5_missing_4_32.py'
      - '.github/workflows/cmct_m5_missing_4_32.yml'
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/search_commons_m5_missing_4_32.py | tee search_missing_4_32.log
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-missing-4-32
          path: |
            evidence/m5_t1_target_missing_4_32/
            search_missing_4_32.log
          if-no-files-found: error
          retention-days: 30
