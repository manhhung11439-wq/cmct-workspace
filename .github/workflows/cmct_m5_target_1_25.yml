name: CMCT M5 targeted 1-25 medicinal material search
on:
  push:
    paths:
      - 'scripts/search_commons_m5_1_25.py'
      - '.github/workflows/cmct_m5_target_1_25.yml'
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/search_commons_m5_1_25.py | tee search_m5_1_25.log
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-target-1-25
          path: |
            evidence/m5_t1_1_25_commons/
            search_m5_1_25.log
          if-no-files-found: error
          retention-days: 30
