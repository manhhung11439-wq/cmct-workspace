name: CMCT M5 074 Isatis dried leaves
on:
  push:
    paths:
      - 'scripts/acquire_m5_074_isatis_dried.py'
      - '.github/workflows/cmct_m5_074_isatis_dried.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_074_isatis_dried.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-074-isatis-dried
          path: |
            evidence/m5_t1_074_isatis_dried_leaves/
            acquire.log
          if-no-files-found: error
          retention-days: 30
