name: CMCT M5 118 FULLGATE
on:
  push:
    paths:
      - 'scripts/fullgate_m5_118_barleria.py'
      - '.github/workflows/cmct_m5_118_fullgate.yml'
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pymupdf
      - run: set -o pipefail; python scripts/fullgate_m5_118_barleria.py | tee gate.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-118-fullgate
          path: |
            evidence/m5_t1_118_fullgate/
            gate.log
          if-no-files-found: error
          retention-days: 30
