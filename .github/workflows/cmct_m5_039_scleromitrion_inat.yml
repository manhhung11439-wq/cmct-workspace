name: CMCT M5 039 Scleromitrion harvested whole plant
on:
  push:
    paths:
      - 'scripts/acquire_m5_039_scleromitrion_inat.py'
      - '.github/workflows/cmct_m5_039_scleromitrion_inat.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_039_scleromitrion_inat.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-039-scleromitrion-inat
          path: |
            evidence/m5_t1_039_scleromitrion_inat/
            acquire.log
          if-no-files-found: error
          retention-days: 30
