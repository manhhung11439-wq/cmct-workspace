name: CMCT M5 PD atlas scout 006-018
on:
  push:
    paths:
      - 'scripts/scout_m5_atlas_006_018.py'
      - '.github/workflows/cmct_m5_atlas_006_018.yml'
  workflow_dispatch:
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pymupdf pillow
      - run: set -o pipefail; python scripts/scout_m5_atlas_006_018.py | tee scout_m5_atlas_006_018.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-atlas-006-018
          path: |
            evidence/m5_t1_atlas_006_018/
            scout_m5_atlas_006_018.log
          if-no-files-found: error
          retention-days: 30
