name: CMCT M5 038 Celastrus MDPI dried powder
on:
  push:
    paths:
      - 'scripts/acquire_m5_038_celastrus_mdpi.py'
      - '.github/workflows/cmct_m5_038_celastrus_mdpi.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_038_celastrus_mdpi.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-038-celastrus-mdpi
          path: |
            evidence/m5_t1_038_celastrus_mdpi/
            acquire.log
          if-no-files-found: error
          retention-days: 30
