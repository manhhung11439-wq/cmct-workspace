name: CMCT M5 exact species-category scan
on:
  push:
    paths:
      - 'scripts/scan_m5_species_categories.py'
      - '.github/workflows/cmct_m5_species_categories.yml'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/scan_m5_species_categories.py | tee species_category_scan.log
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-species-category-scan
          path: |
            evidence/m5_t1_species_category_scan/
            species_category_scan.log
          if-no-files-found: error
          retention-days: 30
