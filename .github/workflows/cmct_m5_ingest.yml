name: CMCT M5 binary ingest

on:
  push:
    paths:
      - 'ingest/m5_batch_001.json'
      - '.github/workflows/cmct_m5_ingest.yml'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact original binaries
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import json, hashlib, mimetypes, pathlib, urllib.request
          from PIL import Image
          out=pathlib.Path("out_m5_batch_001"); out.mkdir(exist_ok=True)
          req=json.loads(pathlib.Path("ingest/m5_batch_001.json").read_text(encoding="utf-8"))
          lines=["id\tfilename\turl\tbytes\tsha1\tsha256\tmime\twidth\theight\texpected_sha1_match"]
          for item in req["items"]:
              fn=item["filename"]
              url=item["url"]
              request=urllib.request.Request(url, headers={"User-Agent":"CMCT-image-audit/1.0"})
              with urllib.request.urlopen(request, timeout=120) as r:
                  data=r.read()
                  ctype=(r.headers.get_content_type() or "")
              p=out/fn; p.write_bytes(data)
              s1=hashlib.sha1(data).hexdigest(); s256=hashlib.sha256(data).hexdigest()
              with Image.open(p) as im:
                  w,h=im.size
                  fmt=im.format
              mime=ctype or (Image.MIME.get(fmt) if fmt else "") or mimetypes.guess_type(fn)[0] or ""
              exp=(item.get("expected_sha1") or "").lower()
              match="NA" if not exp else str(s1.lower()==exp).upper()
              if exp and s1.lower()!=exp:
                  raise SystemExit(f"SHA1 mismatch for {fn}: got {s1}, expected {exp}")
              lines.append("\t".join(map(str,[item["id"],fn,url,len(data),s1,s256,mime,w,h,match])))
          (out/"binary_manifest.tsv").write_text("\n".join(lines)+"\n", encoding="utf-8")
          (out/"request.json").write_text(json.dumps(req,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - name: Upload original-binary evidence
        uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-batch-001
          path: out_m5_batch_001/
          if-no-files-found: error
          retention-days: 30
