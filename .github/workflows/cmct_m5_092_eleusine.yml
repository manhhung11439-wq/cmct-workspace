name: CMCT M5 092 Eleusine whole plant
on:
  push:
    paths:
      - 'scripts/acquire_m5_092_eleusine.py'
      - '.github/workflows/cmct_m5_092_eleusine.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_092_eleusine.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-092-eleusine
          path: |
            evidence/m5_t1_092_eleusine/
            acquire.log
          if-no-files-found: error
          retention-days: 30
