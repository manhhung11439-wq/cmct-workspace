name: CMCT M5 118 visual review
on:
  push:
    paths:
      - 'scripts/review_m5_118_only.py'
      - '.github/workflows/cmct_m5_review_118_only.yml'
  workflow_dispatch:
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pymupdf pillow
      - run: python scripts/review_m5_118_only.py | tee review.log
