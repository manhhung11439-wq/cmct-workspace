name: CMCT M5 053 BMC Isatidis figure
on:
  push:
    paths:
      - 'scripts/acquire_m5_053_bmc.py'
      - '.github/workflows/cmct_m5_053_bmc.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pymupdf pillow
      - run: set -o pipefail; python scripts/acquire_m5_053_bmc.py | tee m5_053_bmc.log
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-053-bmc
          path: |
            evidence/m5_t1_053_banlangen_bmc/
            m5_053_bmc.log
          if-no-files-found: error
          retention-days: 30
