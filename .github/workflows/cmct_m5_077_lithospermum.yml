name: CMCT M5 077 Lithospermum dried root
on:
  push:
    paths:
      - 'scripts/acquire_m5_077_lithospermum.py'
      - '.github/workflows/cmct_m5_077_lithospermum.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: python scripts/acquire_m5_077_lithospermum.py
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-077-lithospermum
          path: evidence/m5_t1_077_lithospermum/
          retention-days: 30
