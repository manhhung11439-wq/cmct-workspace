name: CMCT M5 033 Cortex Moutan
on:
  push:
    paths:
      - 'scripts/acquire_m5_033_cortex_moutan.py'
      - '.github/workflows/cmct_m5_033_cortex_moutan.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_033_cortex_moutan.py | tee acquire_m5_033_cortex_moutan.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-033-cortex-moutan
          path: |
            evidence/m5_t1_033_cortex_moutan/
            acquire_m5_033_cortex_moutan.log
          if-no-files-found: error
          retention-days: 30
