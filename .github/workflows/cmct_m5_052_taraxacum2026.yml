name: CMCT M5 052 Taraxacum 2026 figures
on:
  push:
    paths:
      - 'scripts/acquire_m5_052_taraxacum2026.py'
      - '.github/workflows/cmct_m5_052_taraxacum2026.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_052_taraxacum2026.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-052-taraxacum2026
          path: |
            evidence/m5_t1_052_taraxacum2026/
            acquire.log
          if-no-files-found: error
          retention-days: 30
