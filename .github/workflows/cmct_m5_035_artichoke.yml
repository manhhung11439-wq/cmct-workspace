name: CMCT M5 035 artichoke harvested heads
on:
  push:
    paths:
      - 'scripts/acquire_m5_035_artichoke.py'
      - '.github/workflows/cmct_m5_035_artichoke.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_035_artichoke.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-035-artichoke
          path: |
            evidence/m5_t1_035_artichoke/
            acquire.log
          if-no-files-found: error
          retention-days: 30
