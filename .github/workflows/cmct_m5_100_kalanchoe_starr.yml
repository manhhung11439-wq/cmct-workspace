name: CMCT M5 100 Kalanchoe Starr leaf
on:
  push:
    paths:
      - 'scripts/acquire_m5_100_kalanchoe_starr.py'
      - '.github/workflows/cmct_m5_100_kalanchoe_starr.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_100_kalanchoe_starr.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-100-kalanchoe-starr
          path: |
            evidence/m5_t1_100_kalanchoe_starr/
            acquire.log
          if-no-files-found: error
          retention-days: 30
