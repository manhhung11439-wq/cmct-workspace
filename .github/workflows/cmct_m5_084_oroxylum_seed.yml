name: CMCT M5 084 Oroxylum seed
on:
  push:
    paths:
      - 'scripts/acquire_m5_084_oroxylum_seed.py'
      - '.github/workflows/cmct_m5_084_oroxylum_seed.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_084_oroxylum_seed.py | tee acquire_m5_084_oroxylum_seed.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-084-oroxylum-seed
          path: |
            evidence/m5_t1_084_oroxylum_seed/
            acquire_m5_084_oroxylum_seed.log
          if-no-files-found: error
          retention-days: 30
