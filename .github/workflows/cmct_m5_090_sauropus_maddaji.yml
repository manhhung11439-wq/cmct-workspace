name: CMCT M5 090 Sauropus leaf vegetable
on:
  push:
    paths:
      - 'scripts/acquire_m5_090_sauropus_maddaji.py'
      - '.github/workflows/cmct_m5_090_sauropus_maddaji.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_090_sauropus_maddaji.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-090-sauropus-maddaji
          path: |
            evidence/m5_t1_090_sauropus_maddaji/
            acquire.log
          if-no-files-found: error
          retention-days: 30
