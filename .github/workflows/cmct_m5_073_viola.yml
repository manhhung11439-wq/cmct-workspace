name: CMCT M5 073 Viola scientific figure acquisition
on:
  push:
    paths:
      - 'scripts/acquire_m5_073_viola.py'
      - '.github/workflows/cmct_m5_073_viola.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pymupdf pillow
      - run: python scripts/acquire_m5_073_viola.py | tee m5_073_viola.log
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-073-viola
          path: |
            evidence/m5_t1_073_viola/
            m5_073_viola.log
          if-no-files-found: error
          retention-days: 30
