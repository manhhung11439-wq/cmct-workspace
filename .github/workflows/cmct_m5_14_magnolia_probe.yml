name: CMCT M5 14 Magnolia scientific figure probe
on:
  push:
    paths:
      - 'scripts/probe_m5_14_magnolia_pmc.py'
      - '.github/workflows/cmct_m5_14_magnolia_probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/probe_m5_14_magnolia_pmc.py | tee m5_14_magnolia_probe.log
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-14-magnolia-scientific-figures
          path: |
            evidence/m5_14_magnolia_pmc/
            m5_14_magnolia_probe.log
          if-no-files-found: error
          retention-days: 30
