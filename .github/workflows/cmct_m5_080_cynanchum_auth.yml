name: CMCT M5 080 Cynanchum crude-drug authentication
on:
  push:
    paths:
      - 'scripts/scout_m5_080_cynanchum_auth.py'
      - '.github/workflows/cmct_m5_080_cynanchum_auth.yml'
  workflow_dispatch:
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/scout_m5_080_cynanchum_auth.py | tee scout.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-080-cynanchum-auth
          path: |
            evidence/m5_t1_080_cynanchum_auth/
            scout.log
          if-no-files-found: error
          retention-days: 30
