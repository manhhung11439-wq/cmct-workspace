name: CMCT M5 Commons detached-part screen
on:
  push:
    paths:
      - 'scripts/scout_m5_commons_detached_parts.py'
      - '.github/workflows/cmct_m5_commons_detached_parts.yml'
  workflow_dispatch:
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/scout_m5_commons_detached_parts.py | tee scout.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-commons-detached-parts
          path: |
            evidence/m5_commons_detached_screen/
            scout.log
          if-no-files-found: error
          retention-days: 30
