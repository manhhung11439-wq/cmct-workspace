name: CMCT M5 124 Clinacanthus dried material
on:
  push:
    paths:
      - 'scripts/acquire_m5_124_clinacanthus_dried.py'
      - '.github/workflows/cmct_m5_124_clinacanthus_dried.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_124_clinacanthus_dried.py | tee acquire_m5_124_clinacanthus_dried.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-124-clinacanthus-dried
          path: |
            evidence/m5_t1_124_clinacanthus_dried/
            acquire_m5_124_clinacanthus_dried.log
          if-no-files-found: error
          retention-days: 30
