name: CMCT M5 WIKTROP scan 083 092
on:
  push:
    paths:
      - 'scripts/acquire_m5_wiktrop_scan_083_092.py'
      - '.github/workflows/cmct_m5_wiktrop_scan_083_092.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow beautifulsoup4
      - run: set -o pipefail; python scripts/acquire_m5_wiktrop_scan_083_092.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-wiktrop-scan-083-092
          path: |
            evidence/m5_t1_wiktrop_scan_083_092/
            acquire.log
          if-no-files-found: error
          retention-days: 30
