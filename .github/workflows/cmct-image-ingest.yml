name: CMCT T1 M5-19 iNaturalist exuvia verify
on:
  push:
    paths:
      - .cmct-ingest-trigger
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Query photo metadata and exact bytes
        shell: bash
        run: |
          set -u
          mkdir -p out
          UA="Mozilla/5.0 CMCT-image-audit/1.0"
          for u in             "https://api.inaturalist.org/v1/photos/21995070"             "https://www.inaturalist.org/photos/21995070.json"             "https://api.inaturalist.org/v1/observations?photo_id=21995070"             "https://api.inaturalist.org/v1/observations?taxon_id=319989&photos=true&per_page=200&d1=2018-07-26&d2=2018-07-27"
          do
            echo "===== $u ====="
            curl -L -A "$UA" --connect-timeout 15 --max-time 120 -sS "$u" || true
            echo
          done | tee out/metadata.txt
          URL="https://inaturalist-open-data.s3.amazonaws.com/photos/21995070/original.jpg"
          code=$(curl -L -A "$UA" --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 -sS -w "%{http_code}" -o out/21995070_original.jpg "$URL" || true)
          echo "image_http=$code"
          file out/21995070_original.jpg || true
          wc -c out/21995070_original.jpg || true
          sha1sum out/21995070_original.jpg || true
          sha256sum out/21995070_original.jpg || true
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-tap1-m5-19-inat-exuvia
          path: out/
          compression-level: 0
          retention-days: 7
