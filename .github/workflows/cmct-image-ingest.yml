name: CMCT T1 exact image ingest ginger
on:
  push:
    paths:
      - .cmct-ingest-trigger
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Download ginger original
        run: |
          mkdir -p images
          sleep 5
          curl -L --fail --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 120 -A "Mozilla/5.0 CMCT-image-audit/1.0" "https://upload.wikimedia.org/wikipedia/commons/2/20/Zingiber_officinale.JPG?utm_campaign=index&utm_content=original&utm_source=commons.wikimedia.org" -o "images/3_Zingiber_officinale.JPG"
          sha1sum images/3_Zingiber_officinale.JPG | tee images/sha1.txt
          sha256sum images/3_Zingiber_officinale.JPG | tee images/sha256.txt
          file images/3_Zingiber_officinale.JPG | tee images/file.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmct-tap1-ginger-original
          path: images/
          compression-level: 0
          retention-days: 7
