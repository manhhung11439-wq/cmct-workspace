name: CMCT T1 M5-19 iNaturalist metadata select
on:
  push:
    paths:
      - .cmct-ingest-trigger
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Open Dataset metadata
        run: |
          mkdir -p m5_19_meta
          python -m pip install --quiet boto3
          python scripts/query_inat_m5_19.py
      - name: Upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmct-tap1-m5-19-inat-metadata
          path: m5_19_meta/
          retention-days: 7
