name: CMCT T1 M5 3 dried ginger ingest
on:
  push:
    paths:
      - .cmct-ingest-trigger
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact Commons original
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 15 --max-time 180 -A "CMCT-image-audit/1.0" "https://commons.wikimedia.org/wiki/Special:Redirect/file/Dried_ginger_slices.jpg" -o "images/3_M5_Dried_ginger_slices.jpg"
          wc -c images/3_M5_Dried_ginger_slices.jpg | tee images/bytes.txt
          sha1sum images/3_M5_Dried_ginger_slices.jpg | tee images/sha1.txt
          sha256sum images/3_M5_Dried_ginger_slices.jpg | tee images/sha256.txt
          file images/3_M5_Dried_ginger_slices.jpg | tee images/file.txt
      - name: Upload exact binary
        uses: actions/upload-artifact@v4
        with:
          name: cmct-tap1-m5-3-dried-ginger
          path: images/
          compression-level: 0
          retention-days: 7
