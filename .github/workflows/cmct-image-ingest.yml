name: CMCT exact-image binary ingest

on:
  push:
    paths:
      - ".cmct-ingest-trigger"

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare tools
        run: python -m pip install --quiet pillow

      - name: Download exact originals and build manifest
        shell: bash
        run: |
          set -u
          mkdir -p cmct_exact_images
          cat > /tmp/targets.tsv <<'EOF'
          19	Cryptotympana_atrata.jpg	https://upload.wikimedia.org/wikipedia/commons/5/51/Cryptotympana_atrata.jpg
          87	Vernonia_amygdalina_01.jpg	https://upload.wikimedia.org/wikipedia/commons/0/08/Vernonia_amygdalina_01.jpg
          3	Zingiber_officinale.JPG	https://upload.wikimedia.org/wikipedia/commons/2/20/Zingiber_officinale.JPG
          41	Momordica_charantia_plant.jpg	https://upload.wikimedia.org/wikipedia/commons/b/bc/Momordica_charantia_%28plant%29.jpg
          42	Gypsum_mineral.jpg	https://upload.wikimedia.org/wikipedia/commons/2/2f/Gypsum_mineral.jpg
          47	Forsythia_suspensa2.jpg	https://upload.wikimedia.org/wikipedia/commons/c/c6/Forsythia_suspensa2.jpg
          58	Andrographis_paniculata.jpg	https://upload.wikimedia.org/wikipedia/commons/d/d1/Andrographis_paniculata.jpg
          77	Lithospermum_erythrorhizon.jpg	https://upload.wikimedia.org/wikipedia/commons/f/f2/Lithospermum_erythrorhizon.jpg
          82	Houttuynia_cordata_C.jpg	https://upload.wikimedia.org/wikipedia/commons/6/6d/Houttuynia_cordata_C.jpg
          117	Commelina_communis.JPG	https://upload.wikimedia.org/wikipedia/commons/6/6f/Commelina_communis.JPG
          125	Scoparia_dulcis_of_Kadavoor.jpg	https://upload.wikimedia.org/wikipedia/commons/3/30/Scoparia_dulcis_of_Kadavoor.jpg
          EOF

          printf 'row\tfilename\tstatus\tbytes\tmime\twidth\theight\tsha1\tsha256\turl\n' > cmct_exact_images/manifest.tsv
          while IFS=$'\t' read -r row filename url; do
            out="cmct_exact_images/${row}_${filename}"
            if curl -L --fail --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 180 -A "CMCT-image-audit/1.0" "$url" -o "$out"; then
              python - "$row" "$filename" "$out" "$url" <<'PY'
import hashlib, mimetypes, os, sys
from PIL import Image
row, filename, path, url = sys.argv[1:]
data = open(path,'rb').read()
sha1 = hashlib.sha1(data).hexdigest()
sha256 = hashlib.sha256(data).hexdigest()
size = len(data)
mime = mimetypes.guess_type(filename)[0] or "application/octet-stream"
try:
    with Image.open(path) as im:
        width, height = im.size
        fmt = im.format
        if fmt == "JPEG":
            mime = "image/jpeg"
        elif fmt == "PNG":
            mime = "image/png"
except Exception:
    width = height = 0
with open("cmct_exact_images/manifest.tsv","a",encoding="utf-8") as f:
    f.write(f"{row}\t{filename}\tPASS-DOWNLOAD\t{size}\t{mime}\t{width}\t{height}\t{sha1}\t{sha256}\t{url}\n")
PY
            else
              rm -f "$out"
              printf '%s\t%s\tFAIL-DOWNLOAD\t0\t\t0\t0\t\t\t%s\n' "$row" "$filename" "$url" >> cmct_exact_images/manifest.tsv
            fi
          done < /tmp/targets.tsv
          cat cmct_exact_images/manifest.tsv

      - name: Upload exact-image artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmct-tap1-exact-images
          path: cmct_exact_images/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
