name: CMCT T1 M5-41 dried bitter melon ingest
on:
  push:
    paths:
      - .cmct-ingest-trigger
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Acquire exact Commons original
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p m5_41
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 -G "https://commons.wikimedia.org/w/api.php" --data-urlencode "action=query" --data-urlencode "format=json" --data-urlencode "prop=imageinfo" --data-urlencode "iiprop=url|size|sha1|mime|extmetadata" --data-urlencode "titles=File:Dried bitter melon slices (20240123).jpg" -o m5_41/commons_imageinfo.json
          jq '.query.pages[] .imageinfo[0] | {url,descriptionurl,width,height,size,sha1,mime,extmetadata}' m5_41/commons_imageinfo.json > m5_41/metadata_selected.json
          URL=$(jq -r '.query.pages[] .imageinfo[0].url' m5_41/commons_imageinfo.json)
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 -A "CMCT-image-audit/1.0" "$URL" -o m5_41/Dried_bitter_melon_slices_20240123.jpg
          sha1sum m5_41/Dried_bitter_melon_slices_20240123.jpg | tee m5_41/local_sha1.txt
          sha256sum m5_41/Dried_bitter_melon_slices_20240123.jpg | tee m5_41/local_sha256.txt
          file m5_41/Dried_bitter_melon_slices_20240123.jpg | tee m5_41/file.txt
          wc -c m5_41/Dried_bitter_melon_slices_20240123.jpg | tee m5_41/bytes.txt
          cat m5_41/metadata_selected.json
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmct-tap1-m5-41-dried-bitter-melon
          path: m5_41/
          compression-level: 0
          retention-days: 7
