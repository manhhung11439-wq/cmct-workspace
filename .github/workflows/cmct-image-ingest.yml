name: CMCT T1 M5-19 render supplementary
on:
  push:
    paths:
      - .cmct-ingest-trigger
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Download and render supplementary PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pages
          URL="https://mdpi-res.com/d_attachment/insects/insects-11-00168/article_deploy/insects-11-00168-s001.pdf"
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 3 -A "Mozilla/5.0 CMCT-image-audit/1.0" "$URL" -o out/insects-11-00168-s001.pdf
          echo "=== PDFINFO ==="
          pdfinfo out/insects-11-00168-s001.pdf
          echo "=== PDFTEXT ==="
          pdftotext -layout out/insects-11-00168-s001.pdf out/supp.txt
          cat out/supp.txt
          echo "=== IMAGES ==="
          pdfimages -list out/insects-11-00168-s001.pdf || true
          pdftoppm -png -r 144 out/insects-11-00168-s001.pdf out/pages/page
          sha1sum out/insects-11-00168-s001.pdf > out/sha1.txt
          sha256sum out/insects-11-00168-s001.pdf > out/sha256.txt
          find out/pages -type f -printf '%f %s bytes\n'
      - name: Upload rendered supplementary
        uses: actions/upload-artifact@v4
        with:
          name: cmct-tap1-m5-19-rendered-supplement
          path: out/
          compression-level: 0
          retention-days: 7
