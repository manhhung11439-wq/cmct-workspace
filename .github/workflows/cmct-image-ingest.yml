name: CMCT T1 M5-19 permissive exuvia search
on:
  push:
    paths:
      - .cmct-ingest-trigger
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet requests pillow
      - name: Search exact taxon permissive photos
        run: python scripts/cmct_search_m5_19.py | tee evidence/m5_19_inat_permissive/search.log
      - name: Commit search evidence
        run: |
          git config user.name "CMCT evidence bot"
          git config user.email "actions@users.noreply.github.com"
          git add evidence/m5_19_inat_permissive
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Search permissive exact C. atrata exuvia candidates"
            git push
          fi
