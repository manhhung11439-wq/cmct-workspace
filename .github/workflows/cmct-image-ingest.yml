name: CMCT T1 M5-19 iNaturalist metadata stream
on:
  push:
    paths:
      - .cmct-ingest-trigger
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Stream photos metadata to exact photo id
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p m5_19_meta
          (curl -L --fail --max-time 300 --retry 2 "https://inaturalist-open-data.s3.amazonaws.com/photos.csv.gz" | gzip -dc | awk -F '\t' 'NR==1{print > "m5_19_meta/photos_header.tsv"} $2=="21995070"{print > "m5_19_meta/photo_row.tsv"; exit}') || true
          if [ -s m5_19_meta/photo_row.tsv ]; then
            OBS=$(cut -f4 m5_19_meta/photo_row.tsv)
            echo "$OBS" > m5_19_meta/observer_id.txt
            (curl -L --fail --max-time 120 --retry 2 "https://inaturalist-open-data.s3.amazonaws.com/observers.csv.gz" | gzip -dc | awk -F '\t' -v id="$OBS" 'NR==1{print > "m5_19_meta/observers_header.tsv"} $1==id{print > "m5_19_meta/observer_row.tsv"; exit}') || true
          fi
          ls -lh m5_19_meta
          cat m5_19_meta/photo_row.tsv 2>/dev/null || true
          cat m5_19_meta/observer_row.tsv 2>/dev/null || true
      - name: Upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmct-tap1-m5-19-inat-metadata-stream
          path: m5_19_meta/
          retention-days: 7
