name: CMCT M5 fresh harvested 109-124
on:
  push:
    paths:
      - 'scripts/search_commons_m5_fresh_109_124.py'
      - '.github/workflows/cmct_m5_fresh_109_124.yml'
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/search_commons_m5_fresh_109_124.py | tee search_fresh_109_124.log
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-fresh-109-124
          path: |
            evidence/m5_t1_fresh_harvest_109_124/
            search_fresh_109_124.log
          if-no-files-found: error
          retention-days: 30
