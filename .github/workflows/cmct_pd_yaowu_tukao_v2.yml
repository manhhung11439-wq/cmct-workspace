name: CMCT PD atlas Yaowu Tukao v2
on:
  push:
    paths:
      - 'scripts/scout_pd_yaowu_tukao_v2.py'
      - '.github/workflows/cmct_pd_yaowu_tukao_v2.yml'
  workflow_dispatch:
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pymupdf
      - run: set -o pipefail; python scripts/scout_pd_yaowu_tukao_v2.py | tee scout.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-pd-yaowu-tukao-v2
          path: |
            evidence/pd_atlas_yaowu_tukao_v2/
            scout.log
          if-no-files-found: error
          retention-days: 30
