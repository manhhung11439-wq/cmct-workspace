name: CMCT M5 drug-name search 33-39
on:
  push:
    paths:
      - 'scripts/search_commons_m5_drugname_33_39.py'
      - '.github/workflows/cmct_m5_drugname_33_39.yml'
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/search_commons_m5_drugname_33_39.py | tee search_drugname_33_39.log
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-drugname-33-39
          path: |
            evidence/m5_t1_drugname_33_39/
            search_drugname_33_39.log
          if-no-files-found: error
          retention-days: 30
