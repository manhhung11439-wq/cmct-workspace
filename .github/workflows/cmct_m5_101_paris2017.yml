name: CMCT M5 101 Paris rhizome
on:
  push:
    paths:
      - 'scripts/acquire_m5_101_paris2017.py'
      - '.github/workflows/cmct_m5_101_paris2017.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pymupdf
      - run: set -o pipefail; python scripts/acquire_m5_101_paris2017.py | tee acquire_m5_101_paris2017.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-101-paris2017
          path: |
            evidence/m5_t1_101_paris2017/
            acquire_m5_101_paris2017.log
          if-no-files-found: error
          retention-days: 30
