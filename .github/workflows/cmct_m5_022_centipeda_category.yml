name: CMCT M5 022 Centipeda exact category
on:
  push:
    paths:
      - 'scripts/acquire_m5_022_centipeda_category.py'
      - '.github/workflows/cmct_m5_022_centipeda_category.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_022_centipeda_category.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-022-centipeda-category
          path: |
            evidence/m5_t1_022_centipeda_category/
            acquire.log
          if-no-files-found: error
          retention-days: 30
