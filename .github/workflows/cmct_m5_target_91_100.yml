name: CMCT M5 target 91-100 crude drug search
on:
  push:
    paths:
      - 'scripts/search_commons_m5_target_91_100.py'
      - '.github/workflows/cmct_m5_target_91_100.yml'
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/search_commons_m5_target_91_100.py | tee search_target_91_100.log
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-target-91-100
          path: |
            evidence/m5_t1_target_91_100/
            search_target_91_100.log
          if-no-files-found: error
          retention-days: 30
