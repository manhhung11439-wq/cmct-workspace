name: CMCT M5 040 Cassia fullsize
on:
  push:
    paths:
      - 'scripts/acquire_m5_040_cassia_fullsize.py'
      - '.github/workflows/cmct_m5_040_cassia_fullsize.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: python scripts/acquire_m5_040_cassia_fullsize.py
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-040-cassia-fullsize
          path: evidence/m5_t1_040_cassia_fullsize/
          if-no-files-found: error
          retention-days: 30
