name: CMCT M5 036 Phyllanthus harvested whole plant
on:
  push:
    paths:
      - 'scripts/acquire_m5_036_phyllanthus_harvested.py'
      - '.github/workflows/cmct_m5_036_phyllanthus_harvested.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_036_phyllanthus_harvested.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-036-phyllanthus-harvested
          path: |
            evidence/m5_t1_036_phyllanthus_harvested/
            acquire.log
          if-no-files-found: error
          retention-days: 30
