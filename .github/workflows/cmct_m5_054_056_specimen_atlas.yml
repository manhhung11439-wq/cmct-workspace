name: CMCT M5 054 056 specimen atlas
on:
  push:
    paths:
      - 'scripts/discover_m5_054_056_specimen_atlas.py'
      - '.github/workflows/cmct_m5_054_056_specimen_atlas.yml'
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pymupdf
      - run: set -o pipefail; python scripts/discover_m5_054_056_specimen_atlas.py | tee specimen_atlas.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-054-056-specimen-atlas
          path: |
            evidence/m5_t1_054_056_specimen_atlas/
            specimen_atlas.log
          if-no-files-found: error
          retention-days: 30
