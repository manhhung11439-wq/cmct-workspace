name: CMCT M5 094 Pulsatilla commercial roots
on:
  push:
    paths:
      - 'scripts/acquire_m5_094_pulsatilla.py'
      - '.github/workflows/cmct_m5_094_pulsatilla.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_094_pulsatilla.py | tee acquire_m5_094_pulsatilla.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-094-pulsatilla
          path: |
            evidence/m5_t1_094_pulsatilla/
            acquire_m5_094_pulsatilla.log
          if-no-files-found: error
          retention-days: 30
