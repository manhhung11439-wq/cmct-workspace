name: CMCT M5 087 dried bitter leaf
on:
  push:
    paths:
      - 'scripts/acquire_m5_087_gymnanthemum.py'
      - '.github/workflows/cmct_m5_087_gymnanthemum.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_087_gymnanthemum.py | tee m5_087_gymnanthemum.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-087-gymnanthemum
          path: |
            evidence/m5_t1_087_gymnanthemum/
            m5_087_gymnanthemum.log
          if-no-files-found: error
          retention-days: 30
