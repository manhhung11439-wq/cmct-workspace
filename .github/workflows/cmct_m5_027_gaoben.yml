name: CMCT M5 027 Gaoben medicinal material
on:
  push:
    paths:
      - 'scripts/acquire_m5_027_gaoben.py'
      - '.github/workflows/cmct_m5_027_gaoben.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_027_gaoben.py | tee acquire_m5_027_gaoben.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-027-gaoben
          path: |
            evidence/m5_t1_027_gaoben/
            acquire_m5_027_gaoben.log
          if-no-files-found: error
          retention-days: 30
