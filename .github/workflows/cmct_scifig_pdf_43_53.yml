name: CMCT exact PDF figures M5 43 53
on:
  push:
    paths:
      - 'scripts/extract_scifig_pdf_43_53.py'
      - '.github/workflows/cmct_scifig_pdf_43_53.yml'
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pymupdf pillow
      - run: set -o pipefail; python scripts/extract_scifig_pdf_43_53.py | tee scifig_pdf_43_53.log
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-scifig-pdf-43-53
          path: |
            evidence/m5_t1_scifig_pdf_extract_43_53/
            scifig_pdf_43_53.log
          if-no-files-found: error
          retention-days: 30
