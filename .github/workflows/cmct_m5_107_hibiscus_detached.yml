name: CMCT M5 107 Hibiscus detached flower
on:
  push:
    paths:
      - 'scripts/acquire_m5_107_hibiscus_detached.py'
      - '.github/workflows/cmct_m5_107_hibiscus_detached.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_107_hibiscus_detached.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-107-hibiscus-detached
          path: |
            evidence/m5_t1_107_hibiscus_detached/
            acquire.log
          if-no-files-found: error
          retention-days: 30
