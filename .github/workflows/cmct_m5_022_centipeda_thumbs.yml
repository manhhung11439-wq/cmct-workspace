name: CMCT M5 022 Centipeda thumbnail screen
on:
  push:
    paths:
      - 'scripts/screen_m5_022_centipeda_thumbs.py'
      - '.github/workflows/cmct_m5_022_centipeda_thumbs.yml'
  workflow_dispatch:
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/screen_m5_022_centipeda_thumbs.py | tee screen.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-022-centipeda-thumbs
          path: |
            evidence/m5_t1_022_centipeda_thumbs/
            screen.log
          if-no-files-found: error
          retention-days: 30
