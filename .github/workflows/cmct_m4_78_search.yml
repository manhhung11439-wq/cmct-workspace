name: CMCT M4 78 exact-natural search
on:
  push:
    paths:
      - 'scripts/search_m4_78_gbif.py'
      - '.github/workflows/cmct_m4_78_search.yml'
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/search_m4_78_gbif.py | tee evidence/m4_78_exact_natural/search.log
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m4-78-exact-natural
          path: evidence/m4_78_exact_natural/
          if-no-files-found: error
          retention-days: 30
