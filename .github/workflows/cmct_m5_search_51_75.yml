name: CMCT M5 Commons processed search 51-75
on:
  push:
    paths:
      - 'scripts/search_commons_m5_51_75.py'
      - '.github/workflows/cmct_m5_search_51_75.yml'
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/search_commons_m5_51_75.py | tee search_51_75.log
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-commons-51-75
          path: |
            evidence/m5_t1_51_75_commons/
            search_51_75.log
          if-no-files-found: error
          retention-days: 30
