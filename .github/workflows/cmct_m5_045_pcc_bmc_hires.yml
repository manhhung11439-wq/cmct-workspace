name: CMCT M5 045 PCC BMC hi-res
on:
  push:
    paths:
      - 'scripts/acquire_m5_045_pcc_bmc_hires.py'
      - '.github/workflows/cmct_m5_045_pcc_bmc_hires.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: python scripts/acquire_m5_045_pcc_bmc_hires.py | tee acquire.log
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-045-pcc-bmc-hires
          path: |
            evidence/m5_t1_045_pcc_bmc_hires/
            acquire.log
          if-no-files-found: error
          retention-days: 30
