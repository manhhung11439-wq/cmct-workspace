name: CMCT M5 105 Peperomia figure
on:
  push:
    paths:
      - 'scripts/acquire_m5_105_peperomia.py'
      - '.github/workflows/cmct_m5_105_peperomia.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: set -o pipefail; python scripts/acquire_m5_105_peperomia.py | tee m5_105_peperomia.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-105-peperomia
          path: |
            evidence/m5_t1_105_peperomia/
            m5_105_peperomia.log
          if-no-files-found: error
          retention-days: 30
