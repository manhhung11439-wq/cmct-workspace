name: CMCT M5 056 Lycii Cortex 2024
on:
  push:
    paths:
      - 'scripts/acquire_m5_056_lycii_2024.py'
      - '.github/workflows/cmct_m5_056_lycii_2024.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_056_lycii_2024.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-056-lycii-2024
          path: |
            evidence/m5_t1_056_lycii_cortex_2024/
            acquire.log
          if-no-files-found: error
          retention-days: 30
