name: CMCT M5 125 Scoparia PMC3733203
on:
  push:
    paths:
      - 'scripts/acquire_m5_125_pmc3733203.py'
      - '.github/workflows/cmct_m5_125_pmc3733203.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_125_pmc3733203.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-125-pmc3733203
          path: |
            evidence/m5_t1_125_pmc3733203/
            acquire.log
          if-no-files-found: error
          retention-days: 30
