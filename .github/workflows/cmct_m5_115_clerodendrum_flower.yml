name: CMCT M5 115 Clerodendrum harvested flower
on:
  push:
    paths:
      - 'scripts/acquire_m5_115_clerodendrum_flower.py'
      - '.github/workflows/cmct_m5_115_clerodendrum_flower.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_115_clerodendrum_flower.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-115-clerodendrum-flower
          path: |
            evidence/m5_t1_115_clerodendrum_flower/
            acquire.log
          if-no-files-found: error
          retention-days: 30

# rerun after decoupled taxon verification
