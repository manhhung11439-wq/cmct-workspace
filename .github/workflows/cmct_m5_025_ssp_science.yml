name: CMCT M5 025 SSP Figure 1
on:
  push:
    paths:
      - 'scripts/acquire_m5_025_ssp_science.py'
      - '.github/workflows/cmct_m5_025_ssp_science.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_025_ssp_science.py | tee acquire_m5_025_ssp_science.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-025-ssp-science
          path: |
            evidence/m5_t1_025_ssp_science/
            acquire_m5_025_ssp_science.log
          if-no-files-found: error
          retention-days: 30
