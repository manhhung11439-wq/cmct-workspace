name: CMCT M5 118 Barleria fresh parts
on:
  push:
    paths:
      - 'scripts/acquire_m5_118_barleria.py'
      - '.github/workflows/cmct_m5_118_barleria.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow beautifulsoup4 pymupdf
      - run: set -o pipefail; python scripts/acquire_m5_118_barleria.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-118-barleria
          path: |
            evidence/m5_t1_118_barleria/
            acquire.log
          if-no-files-found: error
          retention-days: 30
