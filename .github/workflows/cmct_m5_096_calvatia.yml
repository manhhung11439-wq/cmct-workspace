name: CMCT M5 096 Calvatia mature material
on:
  push:
    paths:
      - 'scripts/acquire_m5_096_calvatia.py'
      - '.github/workflows/cmct_m5_096_calvatia.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_096_calvatia.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-096-calvatia
          path: |
            evidence/m5_t1_096_calvatia/
            acquire.log
          if-no-files-found: error
          retention-days: 30
