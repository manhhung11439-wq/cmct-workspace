name: CMCT M5 025 Douchi acquisition
on:
  push:
    paths:
      - 'scripts/acquire_m5_025_douchi.py'
      - '.github/workflows/cmct_m5_025_douchi.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_025_douchi.py | tee acquire_m5_025_douchi.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-025-douchi
          path: |
            evidence/m5_t1_025_douchi/
            acquire_m5_025_douchi.log
          if-no-files-found: error
          retention-days: 30
