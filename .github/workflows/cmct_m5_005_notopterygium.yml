name: CMCT M5 005 Notopterygium figure scout
on:
  push:
    paths:
      - 'scripts/scout_m5_005_notopterygium.py'
      - '.github/workflows/cmct_m5_005_notopterygium.yml'
  workflow_dispatch:
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/scout_m5_005_notopterygium.py | tee scout_m5_005.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-005-notopterygium-scout
          path: |
            evidence/m5_t1_005_notopterygium_scout/
            scout_m5_005.log
          if-no-files-found: error
          retention-days: 30
