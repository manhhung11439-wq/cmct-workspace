name: CMCT M5 Batch22 fresh-use scout
on:
  push:
    paths:
      - 'scripts/scout_m5_batch22_fresh.py'
      - '.github/workflows/cmct_m5_batch22_fresh.yml'
  workflow_dispatch:
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/scout_m5_batch22_fresh.py | tee scout.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-batch22-fresh-scout
          path: |
            evidence/m5_t1_fresh_scout_batch22/
            scout.log
          if-no-files-found: error
          retention-days: 30
