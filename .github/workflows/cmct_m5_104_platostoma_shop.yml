name: CMCT M5 104 Platostoma shop material
on:
  push:
    paths:
      - 'scripts/acquire_m5_104_platostoma_shop.py'
      - '.github/workflows/cmct_m5_104_platostoma_shop.yml'
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests pillow
      - run: set -o pipefail; python scripts/acquire_m5_104_platostoma_shop.py | tee acquire.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: cmct-m5-104-platostoma-shop
          path: |
            evidence/m5_t1_104_platostoma_shop/
            acquire.log
          if-no-files-found: error
          retention-days: 30
